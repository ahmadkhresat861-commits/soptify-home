<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage and Async Practice</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    .box {
      background-color: #181818;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: #1db954; }
    input {
      padding: 10px;
      width: 60%;
      border-radius: 4px;
      border: 1px solid gray;
      background-color: #121212;
      color: white;
    }
    button {
      padding: 10px 15px;
      background-color: #1db954;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .result { margin-top: 12px; color: #b3b3b3; }
  </style>
</head>
<body>

  <!-- 1. Local Storage -->
  <div class="box">
    <h2>1. Local Storage</h2>
    <p>Saved even after you close the browser.</p>
    <input type="text" id="localInput" placeholder="Your name">
    <button id="localSave">Save</button>
    <button id="localRemove">Remove</button>
    <p class="result" id="localResult"></p>
  </div>

  <!-- 2. Session Storage -->
  <div class="box">
    <h2>2. Session Storage</h2>
    <p>Saved only while this tab is open.</p>
    <input type="text" id="sessionInput" placeholder="A temporary note">
    <button id="sessionSave">Save</button>
    <button id="sessionRemove">Remove</button>
    <p class="result" id="sessionResult"></p>
  </div>

  <!-- 3. Async / Await -->
  <div class="box">
    <h2>3. Async / Await</h2>
    <p>Wait for songs to load without freezing the page.</p>
    <button id="loadBtn">Load songs</button>
    <p class="result" id="asyncResult"></p>
  </div>

  <script src="storage-practice.js"></script>
</body>
</html>
