<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify - Sign up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="signup-container">

    <!-- Spotify logo -->
    <svg class="auth-logo" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill="none" stroke="#ffffff" stroke-width="3"></circle>
      <path d="M13 18c8-2 16-1 23 3M14 25c7-2 14-1 20 2M15 32c6-1 11-1 16 1"
            fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path>
    </svg>

    <h2>Millions of songs.<br>Free on Spotify.</h2>

    <!-- Screen 1: Sign up options -->
    <div id="signupScreen">
      <button class="spotify-button" id="signupBtn">Sign up free</button>

      <div class="signup-options">
        <button class="social-button">
          <span class="social-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="#ffffff" stroke-width="2"></rect><circle cx="12" cy="18" r="1" fill="#ffffff"></circle></svg>
          </span>
          Continue with phone number
        </button>
        <button class="social-button">
          <span class="social-icon">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
          </span>
          Continue with Google
        </button>
        <button class="social-button">
          <span class="social-icon facebook-icon">f</span>
          Continue with Facebook
        </button>
      </div>

      <a href="#" class="switch-link" id="goToLogin">Log in</a>
    </div>

    <!-- Screen 2: Log in -->
    <div id="loginScreen" class="hidden">
      <form id="loginForm" class="auth-form" novalidate>
        <input type="text" id="loginEmail" class="auth-input" placeholder="Email" aria-label="Email">
        <p class="error-message" id="loginEmailError"></p>

        <input type="password" id="loginPassword" class="auth-input" placeholder="Password" aria-label="Password">
        <p class="error-message" id="loginPasswordError"></p>

        <a href="#" class="forgot-link">Forgot password?</a>

        <button type="submit" class="spotify-button">Login</button>
        <p class="success-message" id="loginSuccess"></p>
      </form>

      <a href="#" class="switch-link" id="loginToSignup">Sign Up.</a>
    </div>

    <!-- Screen 3: Register (3 fields) -->
    <div id="registerScreen" class="hidden">
      <form id="registerForm" class="auth-form" novalidate>
        <input type="text" id="registerName" class="auth-input" placeholder="Username" aria-label="Username">
        <p class="error-message" id="registerNameError"></p>

        <input type="text" id="registerEmail" class="auth-input" placeholder="Email" aria-label="Email">
        <p class="error-message" id="registerEmailError"></p>

        <input type="password" id="registerPassword" class="auth-input" placeholder="Password" aria-label="Password">
        <p class="error-message" id="registerPasswordError"></p>

        <a href="#" class="forgot-link">Forgot password?</a>

        <button type="submit" class="spotify-button">Sign up</button>
        <p class="success-message" id="registerSuccess"></p>
      </form>

      <a href="#" class="switch-link" id="registerToLogin">Log in</a>
    </div>

  </div>

  <script src="signup.js"></script>
</body>
</html>
