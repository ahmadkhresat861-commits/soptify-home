<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Spotify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <h2 class="logo">Spotify</h2>

            <nav>
                <nav class="main-navigation">
    <a href="index.html" class="nav-item active">Home</a>
    <a href="search.html" class="nav-item">Search</a>
    <a href="#" class="nav-item">Your Library</a>
</nav>
</nav>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div class="arrows">
                    <button onclick="history.back()">&lsaquo;</button>
                    <button onclick="history.forward()">&rsaquo;</button>
                </div>

                <div class="account-buttons">
                    <button class="signup">Sign up</button>
                    <button class="login">Log in</button>
                </div>
            </header>

            <section class="music-section">
                <h1>Search</h1>

                <input
                    type="search"
                    placeholder="What do you want to play?"
                    class="search-input"
                >
            </section>

        </main>

    </div>

</body>
</html>
